# One command: docker compose up --build   ->  http://localhost:8080
# Secrets come from .env (copy .env.example). Nothing secret is baked into an image.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: documind_ai
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documind_ai"]
      interval: 3s
      retries: 20

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/documind_ai
      APP_ENV: production
      DEBUG: "false"
      STORAGE_DIR: /srv/backend/storage
      CORS_ORIGINS: http://localhost:8080
      COOKIE_SECURE: "false"   # compose serves plain http; set true behind an HTTPS proxy
    depends_on: { db: { condition: service_healthy } }
    volumes: [storage:/srv/backend/storage, models:/models]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 30
      start_period: 20s

  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["8080:80"]
    depends_on: [backend]

volumes: { pgdata: {}, storage: {}, models: {} }
